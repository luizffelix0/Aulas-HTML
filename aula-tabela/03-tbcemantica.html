<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Exemplos 03 - Estrurura </title>

<body>

    <style>
  table { border-collapse: collapse; }
  th, td { border: 1px solid #0c0c0c; padding: 6px 12px; }
  caption { font-weight: bold; padding-bottom: 8px; }
  thead th { background: #d1d1c4; }
  tfoot { background: #fff4b0; font-weight: bold; }
</style>

<table>
  <caption>Pedidos da semana</caption>
  <thead>
    <tr>
      <th scope="col">Produto</th>
      <th scope="col">Qtd.</th>

    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Caderno</td>
      <td>3</td>
      <td>R$ 45,00</td>
    </tr>
    <tr>
      <td>Caneta</td>
      <td>10</td>
      <td>R$ 25,00</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <th scope="row">Total</th>
      <td>13</td>
      <td>R$ 70,00</td>
    </tr>
  </tfoot>
</table>
