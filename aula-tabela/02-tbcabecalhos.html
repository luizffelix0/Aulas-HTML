<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos 02 - Cabeçalhos</title>
</head>

<style>
    th, td {
        border: 1px solid #7893df;
        padding: 6px 12px;
    }
    th {
        background: #f4f4ee;
    }
    
</style>
<body>
    <h1>Boletim</h1>
    <table border="1">
        <tr>
            <th scope="col">Aluno</th>
            <th scope="col">Nota</th>
            <th scope="col">Faltas</th>
        </tr>

        <tr>
            <th scope="row">Ana</th>
            <th>9,5</th>
            <th>2</th>
        </tr>

        <tr>
            <th scope="row">Bruno</th>
            <th>7</th>
            <th>5</th>
        </tr>
    </table>
</body>
</html>
